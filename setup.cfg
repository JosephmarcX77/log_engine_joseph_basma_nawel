[flake8]
max-line-length = 88
exclude = .venv,__pycache__,.git,output,.ipynb_checkpoints,.mypy_cache,.pytest_cache
extend-ignore = E203

[mypy]
python_version = 3.10
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
exclude = (\.venv|output|notebooks)

[tool:pytest]
testpaths = tests
pythonpath = .
addopts = -q
